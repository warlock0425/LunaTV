name: Build TV APK

# 本機開發環境沒有 JDK／Android SDK，因此由 CI 產出可直接側載安裝的 APK。
# 觸發後到 Actions 頁面的該次執行下載 artifact，或從 Release 取得。
on:
  push:
    branches: [main]
    paths:
      - 'tv-app/**'
      - '.github/workflows/tv-apk.yml'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 明確指定版本，讓 gradle 指令一定存在且版本固定；
      # 不倚賴 runner 預裝的 Gradle（版本可能與 AGP 不相容）。
      # AGP 8.7.x 需要 Gradle 8.9 以上。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 直接用 gradle 建置，省掉產生 wrapper 這一步（少一個失敗點）
      - name: Build release APK
        working-directory: tv-app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp tv-app/app/build/outputs/apk/release/app-release.apk \
             "dist/BerserkerTV-tv-${GITHUB_SHA::7}.apk"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BerserkerTV-TV-APK
          path: dist/*.apk
          retention-days: 90

      - name: Attach APK to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
