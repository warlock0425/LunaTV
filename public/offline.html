<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>目前離線</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #e4e4e7;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC',
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 320px;
      }
      img {
        width: 96px;
        height: 96px;
        margin-bottom: 20px;
        opacity: 0.9;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      p {
        font-size: 14px;
        color: #a1a1aa;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 32px;
        border-radius: 12px;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.png" alt="" onerror="this.style.display = 'none'" />
      <h1>目前離線</h1>
      <p>
        網路連線中斷了，內容需要連線才能載入。<br />恢復連線後點擊下方按鈕重試。
      </p>
      <button onclick="location.reload()">重新連線</button>
    </div>
  </body>
</html>
